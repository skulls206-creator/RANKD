<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0D0B14"/>
  <rect width="512" height="512" rx="96" fill="url(#bggrad)" opacity="0.4"/>

  <!-- Ambient purple glow behind bars -->
  <ellipse cx="256" cy="340" rx="140" ry="60" fill="#7C3AED" opacity="0.18" filter="url(#softglow)"/>

  <!-- Bar 1 (left / #3 rank) -->
  <rect x="100" y="290" width="82" height="148" rx="10" fill="url(#barGrad)" filter="url(#glow)" opacity="0.92"/>

  <!-- Bar 2 (center / #1 rank — tallest) -->
  <rect x="215" y="188" width="82" height="250" rx="10" fill="url(#barGrad)" filter="url(#glow)"/>

  <!-- Bar 3 (right / #2 rank) -->
  <rect x="330" y="240" width="82" height="198" rx="10" fill="url(#barGrad)" filter="url(#glow)" opacity="0.92"/>

  <!-- Crown dots on top of bars -->
  <circle cx="141" cy="278" r="8" fill="#C4B5FD" opacity="0.9"/>
  <circle cx="256" cy="176" r="10" fill="#DDD6FE"/>
  <circle cx="371" cy="228" r="8" fill="#C4B5FD" opacity="0.9"/>

  <!-- Thin baseline -->
  <rect x="80" y="436" width="352" height="6" rx="3" fill="#7C3AED" opacity="0.5"/>
</svg>

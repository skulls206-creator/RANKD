name: Deploy RANKD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rankd frontend
        env:
          # Vite reads these at build time. Configure them as repository
          # variables / secrets in GitHub:
          #   vars.RANKD_BASE_PATH         e.g. "/rankd/"   (Pages subpath)
          #   vars.RANKD_API_BASE_URL      e.g. "https://<your-app>.replit.app"
          #   PORT                         dev placeholder required by vite.config
          PORT: "5173"
          # Custom domain (rankd.khurk.xyz) serves from root, so BASE_PATH=/.
          # Override with the RANKD_BASE_PATH repo variable if you ever move
          # back to a github.io/<repo>/ subpath URL.
          BASE_PATH: ${{ vars.RANKD_BASE_PATH || '/' }}
          # Points to rankd API server behind uam.khurk.xyz Caddy reverse proxy
          VITE_API_BASE_URL: https://uam.khurk.xyz/api/rankd
          NODE_ENV: production
        run: pnpm --filter @workspace/rankd run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/rankd/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
